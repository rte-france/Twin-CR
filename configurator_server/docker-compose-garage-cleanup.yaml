services:
  cleanup:
    image: debian
    command: sh -c "rm -rf /var/lib/garage/"
    container_name: garage-cleanup
    volumes:
      - type: bind
        source: ./garage-data/meta
        target: /var/lib/garage/meta
        bind:
          create_host_path: true
      - type: bind
        source: ./garage-data/data
        target: /var/lib/garage/data
        bind:
          create_host_path: true
