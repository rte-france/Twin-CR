---
# 1. Base prerequisites for all nodes (Docker + CNI networking)
- name: Prepare common node environment
  hosts: all
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - base
    - role: docker
      tags: docker
    - role: cni
      tags: cni

# 2. Control plane (Nomad Server + Consul + Vault)
- name: Deploy HashiCorp Control Plane
  hosts: nomad_servers
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: hashicorp
      tags: hashicorp

# 3. Worker nodes (Nomad Clients joining cluster)
- name: Join Nomad Worker Nodes
  hosts: nomad_workers
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: nomad_worker
      tags: worker

# 4. Central Services & Ingress (Only on Server/Primary node)
- name: Deploy Cluster Core Services
  hosts: nomad_servers
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: postgres
      tags: postgres
    - role: registry
      tags: registry
    - role: garage
      tags: garage
    - role: keycloak
      tags: keycloak
    - role: temporal
      tags: temporal
    - role: homepage
      tags: homepage
    - role: apps
      tags: apps
