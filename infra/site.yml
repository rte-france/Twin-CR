---
- name: Prepare services environment
  hosts: all
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - base
    - role: docker
      tags: docker
    - role: cni
      tags: cni
    - role: session_simulators
      tags: simulators

- name: Deploy HashiCorp Cluster
  hosts: nomad_servers:nomad_workers
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: hashicorp
      tags: hashicorp

- name: Deploy Cluster Core Services
  hosts: nomad_servers
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: postgres
      tags: postgres
    - role: registry
      tags: registry
    - role: garage
      tags: garage
    - role: keycloak
      tags: keycloak
