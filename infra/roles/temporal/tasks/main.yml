- name: Install Temporal CLI
  shell: |
    curl -sSf https://temporal.download/cli.sh | sh
  args:
    creates: /root/.temporalio/bin/temporal
  environment: "{{ proxy_env | default({}) | combine({'HOME': '/root'}) }}"

- name: Link Temporal binary
  file:
    src: /root/.temporalio/bin/temporal
    dest: /usr/local/bin/temporal
    state: link
    force: yes

- name: Template Temporal job file
  ansible.builtin.template:
    src: temporal.nomad.j2
    dest: /tmp/temporal.nomad

- name: Deploy Temporal via Nomad
  command: nomad job run /tmp/temporal.nomad
