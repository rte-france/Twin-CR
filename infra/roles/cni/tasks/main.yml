---
- name: Create CNI directory
  file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Download CNI plugins
  get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_version }}/cni-plugins-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}-{{ cni_version }}.tgz"
    dest: /tmp/cni-plugins.tgz
  environment: "{{ proxy_env | default({}) }}"
  vars:
    cni_version: "v1.4.0"

- name: Install CNI plugins
  unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: yes
