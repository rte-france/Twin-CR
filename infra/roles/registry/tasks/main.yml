---
- name: Create directories for Registry data
  ansible.builtin.file:
    path: /opt/registry/data
    state: directory
    mode: "0755"

- name: Template Registry job file
  ansible.builtin.template:
    src: registry.nomad.hcl.j2
    dest: /tmp/registry.nomad.hcl

- name: Deploy Registry via Nomad CLI
  ansible.builtin.command: nomad job run /tmp/registry.nomad.hcl
  register: nomad_run_registry
  changed_when: "'Job registration successful' in nomad_run_registry.stdout"
