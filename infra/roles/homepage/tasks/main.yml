---
- name: Create Homepage config directory
  ansible.builtin.file:
    path: /opt/homepage/config
    state: directory
    mode: "0755"

- name: Template Homepage configuration files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/opt/homepage/config/{{ item }}"
    mode: "0644"
  loop:
    - settings.yaml
    - services.yaml
    - bookmarks.yaml

- name: Template Homepage job
  ansible.builtin.template:
    src: homepage.nomad.hcl.j2
    dest: /tmp/homepage.nomad.hcl

- name: Deploy Homepage via Nomad CLI
  ansible.builtin.command: nomad job run -detach /tmp/homepage.nomad.hcl
  register: nomad_run_homepage
  changed_when: "'Job registration successful' in nomad_run_homepage.stdout"
