---
- name: Create twineu user
  user:
    name: twineu
    shell: /bin/bash
    groups: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"
    append: yes

- name: Update apt cache and install dependencies (Ubuntu / Debian)
  apt:
    name:
      - curl
      - unzip
      - jq
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install dependencies (Red Hat / CentOS)
  yum:
    name:
      - curl
      - unzip
      - jq
    state: present
  when: ansible_facts['os_family'] == "RedHat"
