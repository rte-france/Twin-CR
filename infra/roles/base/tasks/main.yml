---
- name: Create twincr user
  user:
    name: twincr
    shell: /bin/bash
    groups: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"
    append: yes

- name: Update apt cache and install dependencies (Ubuntu / Debian)
  apt:
    name:
      - curl
      - unzip
      - jq
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install dependencies (Red Hat / CentOS)
  yum:
    name:
      - curl
      - unzip
      - jq
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Dynamically resolve and configure upstream DNS in containerized environments
  ansible.builtin.shell: |
    python3 - << 'EOF'
    import socket
    candidates = []
    with open('/etc/resolv.conf', 'r') as f:
        for line in f:
            line = line.strip()
            if line.startswith('nameserver') and line.split()[1] != '127.0.0.11':
                candidates.append(line.split()[1])
            elif 'ExtServers:' in line:
                candidates.extend(line.split('[')[1].split(']')[0].split())

    responsive = []
    query = b'\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x02fr\x00\x00\x01\x00\x01'
    for ip in candidates:
        if ip in responsive:
            continue
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.settimeout(0.8)
        try:
            s.sendto(query, (ip, 53))
            data, _ = s.recvfrom(512)
            if data:
                responsive.append(ip)
        except Exception:
            pass
        finally:
            s.close()

    if responsive:
        with open('/etc/resolv.conf', 'r') as f:
            content = f.read()
        new_lines = [f"nameserver {d}" for d in responsive if f"nameserver {d}" not in content]
        if new_lines:
            with open('/etc/resolv.conf', 'w') as f:
                f.write('\n'.join(new_lines) + '\n' + content)
    EOF
  when:
    - ansible_connection == "docker" or (ansible_virtualization_type | default('')) == "docker"
  changed_when: false

# systemd-binfmt clears every binfmt_misc handler on start and stop, and in a privileged container these are those of
# the whole Docker host: masked so that the containers do not remove the amd64 emulation of the host (see infra:linux)
- name: Mask systemd-binfmt in containerized environments
  ansible.builtin.systemd:
    name: systemd-binfmt.service
    masked: true
  when:
    - ansible_connection == "docker" or (ansible_virtualization_type | default('')) == "docker"

- name: Ensure base domain records exist in /etc/hosts
  ansible.builtin.shell: |
    grep -q "keycloak.{{ base_domain | default('localhost') }}" /etc/hosts || echo "127.0.0.1 keycloak.{{ base_domain | default('localhost') }} nomad.{{ base_domain | default('localhost') }} consul.{{ base_domain | default('localhost') }} vault.{{ base_domain | default('localhost') }} registry.{{ base_domain | default('localhost') }}" >> /etc/hosts
  changed_when: false
