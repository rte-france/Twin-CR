---
- name: Create directories for Garage data and config
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/garage/data
    - /opt/garage/meta
    - /opt/garage/config

- name: Template Garage configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /opt/garage/config/garage.toml
    mode: "0644"

- name: Template Garage job file
  ansible.builtin.template:
    src: garage.nomad.j2
    dest: /tmp/garage.nomad
    mode: "0644"

- name: Deploy Garage via Nomad CLI
  ansible.builtin.command: nomad job run -detach /tmp/garage.nomad
  register: nomad_run_garage
  changed_when: "'Job registration successful' in nomad_run_garage.stdout"
