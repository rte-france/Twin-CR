---
- name: Create directories for Session Manager
  ansible.builtin.file:
    path: /opt/twincr/session-manager/data
    state: directory
    mode: "0777"

- name: Template Apps Nomad job file
  ansible.builtin.template:
    src: twincr-apps.nomad.hcl.j2
    dest: /tmp/twincr-apps.nomad.hcl
    mode: "0644"

- name: Deploy Session Manager and Configurator Client via Nomad CLI
  ansible.builtin.command: nomad job run -detach /tmp/twincr-apps.nomad.hcl
  register: nomad_run_apps
  changed_when: "'Job registration successful' in nomad_run_apps.stdout"
