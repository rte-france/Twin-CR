---
# Default configuration for dev environment
base_domain: "localhost"
# Public URL of the session manager and the sessions used by Argus, routed by Traefik by path: the session manager at
# <public_url>/lobby, the sessions at <public_url>/sessions/<session>/<service>. https://localhost for a local cluster,
# else the DNS name of the entry point of the cluster. Keycloak and the admin interfaces (nomad., consul., vault.,
# registry., s3.) are on <name>.<base_domain>.
public_url: "https://localhost"
public_host: "{{ public_url | urlsplit('hostname') }}"
proxy_env:
  no_proxy: "localhost,127.0.0.1,::1,172.17.0.0/16,10.0.0.0/8"
  NO_PROXY: "localhost,127.0.0.1,::1,172.17.0.0/16,10.0.0.0/8"
no_proxy_env:
  http_proxy: ""
  https_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  no_proxy: "*"
  NO_PROXY: "*"
