services:
  keycloak:
    build: .
    command:
      - start-dev
      - --import-realm
      - --https-key-store-file=/opt/keycloak/conf/tls/server.p12  # Its password is generated with it, see Dockerfile
    environment:
      # The admin password is required (compose stops if it is missing): set it in .env, see .env-example
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    volumes:
      - ./imports_keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./themes:/opt/keycloak/themes
    ports:
      - "${KEYCLOAK_PORT}:8443"  # Interpolated from the root .env (or keycloak/.env when run standalone)

  keycloak-seed:
    build: ./keycloak-seed
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    depends_on:
      - keycloak