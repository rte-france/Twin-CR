duration = 16
period = 1.0

# The call is due at t=2 and its child at t=8, so at t=5 the child is still Ready. Replacement times are
# absolute, which is the convention replaceEventIfReady parses with.
replace_at = 5.0
replace_match = "open switch"
replace_with = "at 10 seconds, open switch \"01_1_breaker\";"
