duration = 20
period = 1.0

# 01_1 crosses its threshold once and stays there: the plain 'when' must fire exactly once.
[[measurements]]
time = 3.5
iidm_id = "01_1"
attribute = "P"
value = 120.0
[[measurements]]
time = 6.5
iidm_id = "01_1"
attribute = "P"
value = 260.0

# 02_1 crosses, falls back, and crosses again: the rearming one must fire twice.
[[measurements]]
time = 4.5
iidm_id = "02_1"
attribute = "P"
value = 180.0
[[measurements]]
time = 9.5
iidm_id = "02_1"
attribute = "P"
value = 100.0
[[measurements]]
time = 13.5
iidm_id = "02_1"
attribute = "P"
value = 190.0
