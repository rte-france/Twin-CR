##################################################################################
####                     Configuration template to fill in                    ####
##################################################################################


# Level of information to log, use standard Python level DEBUG, INFO, WARNING...
log_level = "DEBUG"

[master]
period = 0.1
speedup = 1
myEnvDynawo_path = "/home/orchestrator/simulators/dynawo/dynawo.sh"

[input_files]
scenario_file = "scenarios_base.json"
job_file = "4Bus.jobs"
dyd_file = "RTConnectors.dyd"  # dyd must be included in the .jobs file
iidm_file = "4Bus.iidm"
game_master_inputs_file = "game_master_inputs.json"
game_master_outputs_file = "game_master_outputs.json"
scada_inputs_file = "scada_inputs.json"
scada_outputs_file = "scada_outputs.json"
cyber_config_file = "cyber_config.json"
other_files = []
other_dirs = []

[hmi]
location = "CC"
state_button_ids = ["PL1_state"]
bool_button_ids = []
#
# slider_config:
#   . id : slider identifier
#   . min : min value to be displayed
#   . tmin : min value to be sent
#   . max : max value to be displayed
#   . tmax : max value to be sent
#   . val : initial value
#   . label : text to be shown before the slider
#   . unit : text to be shown after the slider current value
#
sliders = []

subscribed_substations = [">"]

[hmi.plot_data]
Voltages = ["U_B1", "U_B2", "U_B3", "U_B4"]
Frequency = ["OMEGA"]

[game_master]
state_button_ids = ["PL1_state"]
bool_button_ids = []
subscribed_substations = [">"]
#
# slider_config:
#   . id : slider identifier
#   . min : min value to be displayed
#   . tmin : min value to be sent
#   . max : max value to be displayed
#   . tmax : max value to be sent
#   . val : initial value
#   . label : text to be shown before the slider
#   . unit : text to be shown after the slider current value
#
sliders = []

[game_master.plot_data]
Voltages = ["U_B1", "U_B2", "U_B3", "U_B4"]
Frequency = ["OMEGA"]
