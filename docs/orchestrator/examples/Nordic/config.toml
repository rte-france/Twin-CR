##################################################################################
####                     Configuration template to fill in                    ####
##################################################################################


# Level of information to log, use standard Python level DEBUG, INFO, WARNING...
log_level = "INFO"
automata_commands = ["python tcp_blocker.py"]

[master]
period = 0.1
speedup = 1
myEnvDynawo_path = "/home/orchestrator/simulators/dynawo/dynawo.sh"

[input_files]
scenario_file = "scenarios.json"
dsl_file = "Nordic.dsl"
job_file = "Nordic.jobs"
dyd_file = "RTConnectors.dyd"  # dyd must be included in the .jobs file
iidm_file = "Nordic.xiidm"
game_master_inputs_file = "game_master_inputs.json"
game_master_outputs_file = "game_master_outputs.json"
scada_inputs_file = "scada_inputs_no_map.json"
scada_outputs_file = "scada_outputs_no_map.json"
cyber_config_file = "cyber_config_fake.json"
extra_io_file = "extra_io.json"  # Added to the generated io files by cfg.sh (SCADA input of the TCB automaton tcp_blocker.py)
other_files = ["tcp_blocker.py"]
other_dirs = []

[input_files.argus]
# Synoptic diagrams (argus "Synoptic" window), generated by tools/synoptic/iidm_to_synoptic.py
synoptics_dir = "synoptics"

[hmi]
location = "SCADA"
state_button_ids = []
bool_button_ids = ["TCB_lock"]
#
# slider_config:
#   . id : slider identifier
#   . min : min value to be displayed
#   . tmin : min value to be sent
#   . max : max value to be displayed
#   . tmax : max value to be sent
#   . val : initial value
#   . label : text to be shown before the slider
#   . unit : text to be shown after the slider current value
#
sliders = []

subscribed_substations = [">"]

[hmi.plot_data]
Voltages = ["NETWORK_4047_401_U_value"]

[game_master]
state_button_ids = ["NETWORK_L4032-4044_breaker1_state_value", "NETWORK_L4032-4044_breaker2_state_value"]
bool_button_ids = []
subscribed_substations = ["S_4032", "S_4044", "S_4047"]
#
# slider_config:
#   . id : slider identifier
#   . min : min value to be displayed
#   . tmin : min value to be sent
#   . max : max value to be displayed
#   . tmax : max value to be sent
#   . val : initial value
#   . label : text to be shown before the slider
#   . unit : text to be shown after the slider current value
#
sliders = []

[game_master.plot_data]
Voltages = ["NETWORK_4047_401_U_value"]
