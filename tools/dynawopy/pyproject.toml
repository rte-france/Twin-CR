[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynawopy"
version = "0.1.0"
license = "MPL-2.0"
description = "High level package to update dynawo files."
requires-python = ">=3.10"
authors = [{ name = "Sören Lohr", email = "soeren.lohr@iee.fraunhofer.de" }]
dependencies = [
  "lxml>=4.9",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["dynawopy*"]   # packages to include

[tool.pytest.ini_options]
pythonpath = ["."]
