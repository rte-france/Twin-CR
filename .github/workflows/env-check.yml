name: Env files consistency

on:
  push:
    branches: [ main, develop ]
    paths: &env_paths
      - '**/.env-example'
      - '**/docker-compose*.yaml'
      - 'tools/env_sync.py'
      - '.github/workflows/env-check.yml'
  pull_request:
    branches: [ main, develop ]
    paths: *env_paths

jobs:
  env-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .env-example consistency
        run: python3 tools/env_sync.py check
