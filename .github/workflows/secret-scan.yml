name: Secret scanning

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

env:
  # Exact version and index digest: a tag can be pushed again, the digest cannot.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The repository is mounted in the gitleaks container: keep the token out of .git/config.
          persist-credentials: false

      # git log range of the commits brought by this push or pull request.
      - name: Compute the commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # Usual push: the previous tip is known.
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          elif [ "$PUSH_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            # New branch, or force push: commits not yet on the default branch.
            range="origin/${DEFAULT_BRANCH}..${PUSH_AFTER}"
          else
            # Force push on the default branch: the pushed commit only.
            range="${PUSH_AFTER}^!"
          fi
          echo "Commit range: $range"
          echo "log_opts=$range" >> "$GITHUB_OUTPUT"

      - name: Scan the new commits
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact --no-banner --verbose

      # Also runs when the previous step fails, so that both results are shown.
      - name: Scan the working tree
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" dir /repo \
            --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose
