version: "3"
services:
  configurator-client:
    container_name: configurator-client
    build:
      context: .
      dockerfile: Dockerfile-no-uv
    volumes:
      - ./:/home/orchestrator/configurator_client
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${CONFIGURATOR_PORT}/status" ]
      interval: 1s
      timeout: 0.5s
    ports:
      - "${CONFIGURATOR_EXPOSED_PORT}:${CONFIGURATOR_PORT}"
    environment:
      - NATS_URL=nats://${NATS_HOST}:${NATS_PORT}
    env_file:
      - .env
