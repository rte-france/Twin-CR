# Tools used by setup.sh and the native runs, installed by setup.sh with mise (https://mise.jdx.dev, required).
# Docker (Docker Desktop on Mac) is not handled by mise and must be installed separately.
[tools]
python = "3.11"              # setup.sh, examples config.sh (dynawo_toolbox venv), NRT tests (same as the CI)
uv = "latest"                # configurator_client, session-manager (they get their own Python 3.14 from uv)
node = "20"                  # Argus native run (same as envs/Dockerfile.argus.AppImage)
pnpm = "10.18.3"
jq = "latest"                # envs/fetch_simulators.sh
"pipx:pre-commit" = "4.7.0"   # Pinned: the git hook stores the path of this install, which contains the version
nomad = "latest"

[tasks.setup]
description = "Setup environment and build docker images"
alias = "setup"
depends = [
  "setup:precommit",
  "setup:garage",
  "setup:env",
  "setup:dynawo",
  "setup:devenvs",
  "setup:argus",
  "setup:examples",
  "setup:build",
]
run = "echo '==> Setup completed successfully.'"

